<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نمونه پرامپت‌های گردشگری</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f5f7fb;color:#202124}.wrap{max-width:850px;margin:auto;padding:25px 15px 50px}.head{text-align:center}.head h1{font-size:25px}.head p{color:#667085;line-height:1.9}.tip{background:#fff8e1;border:1px solid #f0d98a;border-radius:14px;padding:14px;line-height:2;font-size:13px;margin:20px 0}.item{background:#fff;border:1px solid #e1e5ea;border-radius:16px;padding:17px;margin:13px 0;box-shadow:0 4px 14px #00000008}.item h2{font-size:16px}.prompt{white-space:pre-wrap;direction:rtl;background:#f8fafc;border-radius:10px;padding:14px;line-height:2;font-size:13px;border:1px solid #eaecf0}.copy{margin-top:10px;background:#4285f4;color:#fff;border:0;border-radius:9px;padding:9px 15px;font:13px Tahoma;cursor:pointer}
</style></head><body><div class="wrap"><div class="head"><h1>💡 نمونه پرامپت‌های کاربردی AI در گردشگری</h1><p>قالب طلایی: نقش + هدف + زمینه + داده + محدودیت + خروجی</p></div>
<div class="tip">هرجا اطلاعات واقعی دارید، بخش‌های داخل [ ] را با اطلاعات کسب‌وکار خود جایگزین کنید. اطلاعات نامطمئن را از AI بخواهید مشخص کند.</div>
<div id="list"></div></div>
<script>
const prompts=[
['۱. برنامه سفر شخصی‌سازی‌شده',`تو یک متخصص طراحی سفر و Destination Expert هستی.\nبرای [مقصد] یک برنامه سفر [۳/۵/۷] روزه برای [نوع مسافر] با بودجه [بودجه] طراحی کن.\nعلایق: [علایق]. محدودیت‌ها: [زمان/حمل‌ونقل/غذا/دسترسی].\nخروجی را به صورت جدول شامل روز، ساعت، فعالیت، مدت، هزینه تقریبی و دلیل پیشنهاد ارائه کن.\nاز برنامه فشرده و جابه‌جایی غیرضروری پرهیز کن.`],
['۲. تولید محتوای Instagram',`تو مدیر بازاریابی دیجیتال یک برند گردشگری هستی.\nبرای معرفی [مقصد]، ۱۰ ایده محتوایی برای Instagram ارائه کن.\nبرای هر ایده: Hook، متن کوتاه، پیشنهاد تصویر/ویدئو، CTA و ۵ هشتگ بنویس.\nمخاطب: [مخاطب هدف]. لحن: [لوکس/صمیمی/ماجراجویانه/خانوادگی].`],
['۳. دستیار هوشمند گردشگری',`تو یک دستیار هوشمند برای [هتل/آژانس/مقصد] هستی.\nبه سؤالات گردشگران درباره اقامت، قیمت، خدمات، جاذبه‌ها و حمل‌ونقل پاسخ بده.\nاطلاعات نامطمئن را حدس نزن. اگر داده کافی نیست سؤال روشن‌کننده بپرس و در موضوعات پیچیده به اپراتور انسانی ارجاع بده.`],
['۴. تحلیل نظرات مشتریان هتل',`نظرات زیر را مانند یک تحلیلگر تجربه مشتری بررسی کن:\n[نظرات مشتریان]\nخروجی: ۵ موضوع پرتکرار، نقاط قوت، نقاط ضعف، احساس غالب، مشکلات فوری، سه اقدام اصلاحی و KPI پیشنهادی.\nبین نتیجه قطعی و برداشت احتمالی تفاوت بگذار.`],
['۵. کمپین فروش گردشگری',`برای [هتل/آژانس/تور/مقصد] یک کمپین فروش ۱۴ روزه طراحی کن.\nهدف: [رزرو/افزایش فروش/فصل کم‌تقاضا]. مخاطب: [مخاطب]. مزیت رقابتی: [مزیت]. بودجه: [بودجه].\nبرای هر روز موضوع محتوا، کانال، CTA و KPI بده.`],
['۶. ترجمه و بومی‌سازی',`متن زیر را برای مخاطبان [کشور/زبان] ترجمه و بومی‌سازی کن:\n[متن]\nلحن حرفه‌ای و دعوت‌کننده باشد. ترجمه تحت‌اللفظی نکن. در پایان ۳ نکته فرهنگی برای جلوگیری از سوءبرداشت ارائه کن.`],
['۷. تحلیل تقاضای گردشگری',`داده‌های زیر را تحلیل کن:\n[داده‌ها]\nدوره‌های اوج و افت، الگوهای فصلی، عوامل احتمالی، فرصت‌های فروش و ۵ اقدام مدیریتی را مشخص کن.\nبین نتیجه قطعی و فرضیه تفاوت بگذار و داده‌های موردنیاز برای تحلیل بهتر را اعلام کن.`],
['۸. طراحی Chatbot گردشگری',`برای [هتل/آژانس/مقصد] یک Conversation Flow طراحی کن.\nسناریوها: رزرو، قیمت، خدمات، پیشنهاد مقصد، شکایت، لغو، تغییر رزرو و انتقال به انسان.\nبرای هر سناریو Intent، سؤال کاربر، پاسخ AI، داده موردنیاز و نقطه انتقال به انسان را مشخص کن.`],
['۹. بهینه‌سازی معرفی هتل',`متن معرفی هتل زیر را برای افزایش جذابیت و نرخ تبدیل بازنویسی کن:\n[متن]\nاطلاعات: [نام، شهر، ستاره، مخاطب، مزیت رقابتی، خدمات].\nخروجی: عنوان، متن ۱۲۰ کلمه‌ای، ۵ مزیت و CTA. هیچ ویژگی غیرموجودی اضافه نکن.`],
['۱۰. طراحی محصول گردشگری جدید',`با توجه به [مقصد/مخاطب/فصل/ظرفیت/رقبا]، ۱۰ محصول یا تجربه گردشگری جدید پیشنهاد بده.\nهر ایده را از ۱ تا ۵ بر اساس جذابیت مشتری، امکان اجرا، هزینه، قابلیت فروش و تمایز امتیاز بده.\nدر پایان ۳ ایده برتر را با دلیل انتخاب کن.`]
];
const list=document.getElementById('list');
prompts.forEach((p,i)=>{const d=document.createElement('div');d.className='item';d.innerHTML='<h2>'+p[0]+'</h2><div class="prompt" id="p'+i+'">'+p[1]+'</div><button class="copy" onclick="copyP('+i+',this)">کپی پرامپت</button>';list.appendChild(d)});
function copyP(i,b){navigator.clipboard.writeText(prompts[i][1]).then(()=>{b.textContent='✓ کپی شد';setTimeout(()=>b.textContent='کپی پرامپت',1300)})}
</script></body></html>
